ursor:pointer;}#diagrammultimediavideomap .arrowheadPath{fill:#0b0b0b;}#diagrammultimediavideomap .edgePath .path{stroke:#376992;stroke-width:2.0px;}#diagrammultimediavideomap .flowchart-link{stroke:#376992;fill:none;}#diagrammultimediavideomap .edgeLabel{background-color:hsl(90, 61.5384615385%, 94.9019607843%);text-align:center;}#diagrammultimediavideomap .edgeLabel rect{opacity:0.5;background-color:hsl(90, 61.5384615385%, 94.9019607843%);fill:hsl(90, 61.5384615385%, 94.9019607843%);}#diagrammultimediavideomap .labelBkg{background-color:rgba(242, 250, 233.9999999999, 0.5);}#diagrammultimediavideomap .cluster rect{fill:#fff9ed;stroke:hsl(30, 21.5384615385%, 89.9019607843%);stroke-width:1px;}#diagrammultimediavideomap .cluster text{fill:rgb(0.0961538462, 0.25, 0.4038461539);}#diagrammultimediavideomap .cluster span,#diagrammultimediavideomap p{color:rgb(0.0961538462, 0.25, 0.4038461539);}#diagrammultimediavideomap div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:sans-serif;font-size:12px;background:hsl(30, 61.5384615385%, 99.9019607843%);border:1px solid hsl(30, 21.5384615385%, 89.9019607843%);border-radius:2px;pointer-events:none;z-index:100;}#diagrammultimediavideomap .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#173750;}#diagrammultimediavideomap :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker orient="auto" markerHeight="12" markerWidth="12" markerUnits="userSpaceOnUse" refY="5" refX="6" viewBox="0 0 10 10" class="marker flowchart" id="diagrammultimediavideomap_flowchart-pointEnd"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker orient="auto" markerHeight="12" markerWidth="12" markerUnits="userSpaceOnUse" refY="5" refX="4.5" viewBox="0 0 10 10" class="marker flowchart" id="diagrammultimediavideomap_flowchart-pointStart"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerP